<!-- success.html - Updated with better webhook handling -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Nexo Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030305;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
        }
        .success-box {
            background: rgba(12,16,26,0.9);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #00f0ff;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .success-box i {
            font-size: 72px;
            color: #00ff66;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 102, 0.3));
        }
        .success-box h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00ff66;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .success-box p { color: #8b949e; font-size: 14px; margin-bottom: 8px; }
        .order-details {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .order-details div {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }
        .order-details .label { color: #8b949e; }
        .order-details .value { color: #00f0ff; font-weight: 600; }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000;
            border: none;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            margin-left: 10px;
        }
        .btn-outline:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ff66;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-box {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.1);
        }
        .status-box.success { border-color: #00ff66; background: rgba(0, 255, 102, 0.05); }
        .status-box.error { border-color: #ff2a5f; background: rgba(255, 42, 95, 0.05); }
        .status-box.pending { border-color: #ffb800; background: rgba(255, 184, 0, 0.05); }
    </style>
</head>
<body>
    <div class="success-box">
        <i class="fas fa-check-circle"></i>
        <h1>✅ PAYMENT SUCCESSFUL!</h1>
        <p style="color: #00ff66; font-weight: 600;">Your payment has been confirmed</p>
        
        <div class="order-details">
            <div><span class="label">Order ID</span><span class="value" id="orderId">-</span></div>
            <div><span class="label">Amount</span><span class="value" id="orderAmount">-</span></div>
            <div><span class="label">Status</span><span class="value" style="color:#00ff66;">✅ Paid</span></div>
        </div>
        
        <div id="balanceStatus" class="status-box pending">
            <p style="font-size: 13px; color: #ffb800;">
                <span class="loading"></span> Updating your balance...
            </p>
        </div>
        
        <p style="font-size: 12px; color: #8b949e; margin-top: 5px;">
            Your balance will be updated shortly. You can now purchase panels.
        </p>
        
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Back to Store</a>
            <a href="/#add-money" class="btn btn-outline"><i class="fas fa-wallet"></i> Check Balance</a>
        </div>
    </div>

    <script>
        // URL se order_id nikaalo
        const params = new URLSearchParams(window.location.search);
        let orderId = params.get('order_id') || params.get('orderId');
        const uid = sessionStorage.getItem('user_uid');
        const amount = sessionStorage.getItem('payable_amount') || '₹1.00';
        
        // ✅ Agar URL me order_id nahi hai toh session se lo
        if (!orderId) {
            orderId = sessionStorage.getItem('current_order_id');
        }
        
        if (orderId) {
            document.getElementById('orderId').textContent = orderId;
        }
        document.getElementById('orderAmount').textContent = amount;

        // ✅ Balance update karne ka function
        async function updateBalance() {
            if (!orderId) {
                document.getElementById('balanceStatus').className = 'status-box error';
                document.getElementById('balanceStatus').innerHTML = `
                    <p style="font-size: 13px; color: #ff2a5f;">
                        ❌ Order ID not found. Please <a href="/" style="color: #00f0ff;">go to Dashboard</a>.
                    </p>
                `;
                return;
            }

            try {
                // ✅ Webhook se balance update hua hai ya nahi check karo
                const response = await fetch(`/api/verify-payment?order_id=${orderId}&uid=${uid || ''}`);
                const data = await response.json();

                console.log('📊 Verify Response:', data);

                if (data.success) {
                    document.getElementById('balanceStatus').className = 'status-box success';
                    document.getElementById('balanceStatus').innerHTML = `
                        <p style="font-size: 13px; color: #00ff66;">
                            ✅ Balance updated! +₹${data.amount || '0'} 
                            ${data.newBalance ? `(New Balance: ₹${data.newBalance})` : ''}
                        </p>
                    `;
                    
                    // ✅ Clear session
                    sessionStorage.removeItem('current_order_id');
                    sessionStorage.removeItem('payable_amount');
                    
                } else if (data.status === 'pending' || data.message?.includes('pending')) {
                    // ⏳ Retry after 3 seconds
                    setTimeout(updateBalance, 3000);
                } else {
                    document.getElementById('balanceStatus').className = 'status-box error';
                    document.getElementById('balanceStatus').innerHTML = `
                        <p style="font-size: 13px; color: #ff2a5f;">
                            ❌ ${data.message || 'Failed to update balance. Please contact support.'}
                            <br><a href="/" style="color: #00f0ff;">Go to Dashboard</a>
                        </p>
                    `;
                }
            } catch (error) {
                console.error('Balance update error:', error);
                // ✅ Retry on error
                setTimeout(updateBalance, 3000);
            }
        }

        // ✅ Start balance update
        if (orderId) {
            // ✅ Try immediately
            setTimeout(updateBalance, 1000);
            
            // ✅ Keep trying every 5 seconds for 2 minutes
            let attempts = 0;
            const maxAttempts = 24; // 24 * 5s = 120 seconds
            const interval = setInterval(() => {
                attempts++;
                if (attempts > maxAttempts) {
                    clearInterval(interval);
                    document.getElementById('balanceStatus').className = 'status-box pending';
                    document.getElementById('balanceStatus').innerHTML = `
                        <p style="font-size: 13px; color: #ffb800;">
                            ⏳ Balance is being processed. It may take a few minutes.
                            <br><a href="/" style="color: #00f0ff;">Go to Dashboard</a>
                        </p>
                    `;
                } else {
                    updateBalance();
                }
            }, 5000);
        } else {
            document.getElementById('balanceStatus').className = 'status-box error';
            document.getElementById('balanceStatus').innerHTML = `
                <p style="font-size: 13px; color: #ffb800;">
                    ⚠️ Session expired. Please <a href="/" style="color: #00f0ff;">go to Dashboard</a> to check your balance.
                </p>
            `;
        }
    </script>
</body>
</html>
